[pytest]
asyncio_mode = auto
; Session-scoped so the single session-scoped `_engine` fixture in
; conftest.py (and its pooled asyncpg connections) stays on one event
; loop for the whole run — a fresh per-test loop would make later tests
; hit "Future attached to a different loop" against pooled connections
; opened by an earlier test's loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = backend/tests
python_files = test_*.py
addopts = -v --tb=short --cov=backend --cov=services --cov=utils --cov-report=term-missing
